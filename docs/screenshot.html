<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>语音速记</title><style>*{box-sizing:border-box}body{margin:0;width:1040px;height:700px;background:#f4f5f7;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#1d2129;padding:36px}
.card{background:#fff;border-radius:20px;height:628px;padding:36px 48px;box-shadow:0 2px 14px rgba(0,0,0,.06);position:relative;display:flex;flex-direction:column}
.brand{position:absolute;right:32px;top:24px;font-size:13px;color:#8a919c}
h1{margin:0 0 10px;font-size:34px;font-weight:700}
.desc{font-size:16px;line-height:1.6;color:#4e5560;margin:0 0 18px}
h2{font-size:15px;color:#ff6a1a;margin:0 0 10px;letter-spacing:1px}
ol{margin:0;padding:0;list-style:none;counter-reset:n}
li{counter-increment:n;display:flex;gap:14px;font-size:16px;line-height:1.55;margin-bottom:10px}
li:before{content:counter(n);flex:none;width:26px;height:26px;border-radius:50%;background:#fff1e8;color:#ff6a1a;font-weight:700;font-size:14px;text-align:center;line-height:26px;margin-top:1px}
.fmt{margin-top:auto;background:#f4f5f7;border-radius:12px;padding:14px 18px;font-size:14px;line-height:1.5;color:#4e5560}.fmt b{color:#1d2129}
.shot{border-radius:10px;border:1px solid #e5e6eb;display:block}
.ov{width:560px;margin:4px 0 18px}</style><body><div class="card"><div class="brand">篝火出品</div><h1>语音速记</h1><p class="desc">按住快捷键说话，松开后文字直接粘贴到正在用的输入框。语音识别在自己电脑上离线完成，录音不上传云端。</p><img class="shot ov" src="screenshot-ui.png"><h2>怎么用</h2><ol><li><span>安装后授予麦克风和辅助功能权限，首次使用下载识别模型</span></li><li><span>在设置里选好快捷键：按住说话，或按一下开始、再按一下结束</span></li><li><span>点进任意输入框，说话，松开后文字自动粘贴进去</span></li></ol><div class="fmt"><b>交付形式　</b>桌面安装包（Windows .exe，Mac Apple 芯片 / Intel .dmg，Linux AppImage）；上游界面含简体中文语言包</div></div></body></html>
